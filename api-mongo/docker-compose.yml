services:
  mongo:
    image: mongo:7
    container_name: bench-mongo
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  api-mongo:
    build: .
    container_name: bench-api-mongo
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: benchmark
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  mongo-data:
