services:
  mongo:
    image: mongo:7
    container_name: bench-mongo
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    # Sem "ports": o Mongo só é alcançável dentro da rede bench-mongo-net, pelo
    # nome de serviço "mongo". Evita conflito com um MongoDB já rodando no host
    # (porta 27017 em uso) e mantém a stack isolada de qualquer coisa fora dela.
    volumes:
      - mongo-data:/data/db
    networks:
      - bench-mongo-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  api-mongo:
    build: .
    container_name: bench-api-mongo
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: benchmark
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      # dá acesso aos scripts de seed de dentro da rede isolada, sem expor o banco no host
      - ../benchmarks:/benchmarks:ro
    networks:
      - bench-mongo-net
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  bench-mongo-net:
    name: bench-mongo-net

volumes:
  mongo-data:
